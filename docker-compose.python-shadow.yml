services:
  python-runtime-shadow:
    build:
      context: ./python-backend
      dockerfile: Dockerfile.production
    restart: on-failure:5
    env_file:
      - ./backend/.env.production
    environment:
      FRONTEND_ORIGIN: ${PYTHON_FRONTEND_ORIGIN:?PYTHON_FRONTEND_ORIGIN is required}
      PYTHON_RUNTIME_MODE: shadow
      PYTHON_LIVE_TRADING_ENABLED: "false"
      EGRESS_HELPER_SOCKET: /run/rulenix-egress/helper.sock
      RULENIX_LOG_DIRECTORY: /var/log/rulenix-python
    volumes:
      - ./secrets/postgres_ca.crt:/run/secrets/postgres_ca.crt:ro
      - python_runtime_logs:/var/log/rulenix-python
      - /run/rulenix-egress:/run/rulenix-egress
    networks:
      - production_path
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

networks:
  production_path:
    external: true
    name: rulenix_default

volumes:
  python_runtime_logs:
