<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Rulenix SuperTrend runtime concurrency flow</title>
  <desc id="desc">Two Tokio worker threads run a scheduler, sequential SENSEX and NIFTY signal evaluation, shared contract selection, concurrent per-user entry tasks, and shared exchange WebSocket feeds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8da2c8"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 18px Inter,Segoe UI,sans-serif;fill:#9fb0cb}
      .box{rx:18;filter:url(#shadow);stroke-width:1.5}.label{font:700 19px Inter,Segoe UI,sans-serif;fill:#fff}.small{font:400 15px Inter,Segoe UI,sans-serif;fill:#d9e3f5}.tiny{font:600 14px Inter,Segoe UI,sans-serif;fill:#b9c8df}.arrow{stroke:#8da2c8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .lane{fill:#0d172a;stroke:#263653;stroke-width:1.5;rx:22}.pill{fill:#17233a;stroke:#344764;stroke-width:1;rx:14}.count{font:700 16px Inter,Segoe UI,sans-serif;fill:#66e3c4}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text id="titleText" x="70" y="64" class="title">SuperTrend Index Options v1 — runtime flow</text>
  <text x="70" y="98" class="subtitle">Production: 2 CPU cores / 2 Tokio worker threads · async tasks are multiplexed, not one OS thread per user</text>

  <rect x="55" y="130" width="1490" height="150" class="lane"/>
  <text x="85" y="165" class="tiny">SCHEDULING LANE · 1 LONG-LIVED ASYNC TASK</text>
  <rect x="90" y="188" width="310" height="64" class="box" fill="url(#primary)"/>
  <text x="115" y="216" class="label">Leader scheduler</text><text x="115" y="239" class="small">5-second clock + DB leader lock</text>
  <path d="M400 220 H510" class="arrow"/>
  <rect x="510" y="188" width="390" height="64" class="box" fill="#1d4ed8" stroke="#60a5fa"/>
  <text x="535" y="216" class="label">Exact 5-minute boundary</text><text x="535" y="239" class="small">09:15, 09:20 … 15:20 IST</text>
  <path d="M900 220 H1010" class="arrow"/>
  <rect x="1010" y="188" width="455" height="64" class="box" fill="#312e81" stroke="#818cf8"/>
  <text x="1035" y="216" class="label">Spawn one SuperTrend cycle</text><text x="1035" y="239" class="small">Session check · 15:20 square-off gate</text>

  <rect x="55" y="310" width="1490" height="270" class="lane"/>
  <text x="85" y="345" class="tiny">SIGNAL LANE · SEQUENTIAL BY DESIGN TO PROTECT ANGEL HISTORICAL-DATA RATE LIMIT</text>
  <rect x="90" y="380" width="280" height="130" class="box" fill="#172554" stroke="#3b82f6"/>
  <text x="115" y="413" class="label">1. SENSEX</text><text x="115" y="441" class="small">One cached/history fetch</text><text x="115" y="466" class="small">SuperTrend (7, 2)</text><text x="115" y="491" class="small">Closed-candle flip check</text>
  <path d="M370 445 H470" class="arrow"/>
  <rect x="470" y="380" width="330" height="130" class="box" fill="#164e63" stroke="#22d3ee"/>
  <text x="495" y="413" class="label">Shared market selection</text><text x="495" y="441" class="small">1 index LTP lookup</text><text x="495" y="466" class="small">1 ATM option selection</text><text x="495" y="491" class="small">1 option LTP / tick record</text>
  <path d="M800 445 H900" class="arrow"/>
  <rect x="900" y="380" width="280" height="130" class="box" fill="#172554" stroke="#3b82f6"/>
  <text x="925" y="413" class="label">2. NIFTY</text><text x="925" y="441" class="small">Runs after SENSEX</text><text x="925" y="466" class="small">Same shared pipeline</text><text x="925" y="491" class="small">Independent failure boundary</text>
  <path d="M1180 445 H1280" class="arrow"/>
  <rect x="1280" y="395" width="220" height="100" class="box" fill="#3f3f46" stroke="#71717a"/>
  <text x="1305" y="429" class="label">No flip?</text><text x="1305" y="459" class="small">Cycle ends safely</text>

  <rect x="55" y="610" width="1490" height="300" class="lane"/>
  <text x="85" y="638" class="tiny">PER-SIGNAL USER FAN-OUT · CURRENTLY UP TO 3 CONCURRENT USER TASKS PER INSTRUMENT</text>
  <rect x="90" y="682" width="300" height="150" class="box" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="115" y="716" class="label">Eligibility + idempotency</text><text x="115" y="746" class="small">Active strategy + instrument</text><text x="115" y="771" class="small">No same-side exposure</text><text x="115" y="796" class="small">Signal not already processed</text>
  <path d="M390 700 H430 V655 H630 V670" class="arrow"/>
  <path d="M430 655 H940 V670" class="arrow"/>
  <path d="M430 655 H1250 V670" class="arrow"/>
  <rect x="490" y="670" width="280" height="174" class="box" fill="url(#success)" stroke="#34d399"/>
  <text x="515" y="704" class="label">User task A</text><text x="515" y="734" class="small">Own lots / TP / SL</text><text x="515" y="759" class="small">Own risk + margin</text><text x="515" y="784" class="small">Own broker session</text><text x="515" y="817" class="count">Concurrent</text>
  <rect x="800" y="670" width="280" height="174" class="box" fill="url(#success)" stroke="#34d399"/>
  <text x="825" y="704" class="label">User task B</text><text x="825" y="734" class="small">Own lots / TP / SL</text><text x="825" y="759" class="small">Own risk + margin</text><text x="825" y="784" class="small">Own broker session</text><text x="825" y="817" class="count">Concurrent</text>
  <rect x="1110" y="670" width="280" height="174" class="box" fill="url(#success)" stroke="#34d399"/>
  <text x="1135" y="704" class="label">User task C</text><text x="1135" y="734" class="small">Own lots / TP / SL</text><text x="1135" y="759" class="small">Own risk + margin</text><text x="1135" y="784" class="small">Own broker session</text><text x="1135" y="817" class="count">Concurrent</text>
  <text x="490" y="875" class="small">A failed/slow user reports a user-specific alert; successful users are not rolled back or blocked.</text>

  <rect x="55" y="940" width="1490" height="130" class="lane"/>
  <text x="85" y="975" class="tiny">LIVE PRICE LANE · SHARED BY EXCHANGE, USERS, AND TOKENS</text>
  <rect x="90" y="998" width="380" height="48" class="pill"/><text x="115" y="1028" class="label">BFO WebSocket task</text><text x="325" y="1028" class="small">SENSEX options</text>
  <rect x="520" y="998" width="380" height="48" class="pill"/><text x="545" y="1028" class="label">NFO WebSocket task</text><text x="755" y="1028" class="small">NIFTY options</text>
  <rect x="950" y="998" width="515" height="48" class="pill"/><text x="975" y="1028" class="label">Tick processing</text><text x="1140" y="1028" class="small">all open orders/trades subscribed together</text>
</svg>
